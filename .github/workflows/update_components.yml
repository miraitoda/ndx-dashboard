name: Update Nasdaq-100 Components

on:
  schedule:
    - cron: '0 22 * * *'   # 每天北京时间 06:00
  workflow_dispatch:

jobs:
  update-ndx:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run updater
        run: python update_components.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ndx_components.py
          if ! git diff --cached --quiet; then
            git commit -m "auto: update ndx components $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
