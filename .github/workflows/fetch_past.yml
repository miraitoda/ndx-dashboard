name: Fetch Past NDX History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      
      # 先把 gh-pages 上的现有文件拉回来（防止覆盖）
      - name: Restore existing files
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- docs/ || true
          mkdir -p docs/history
        continue-on-error: true
      
      - name: Fetch past 4 days history
        run: python fetch_past_dates.py
      
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
